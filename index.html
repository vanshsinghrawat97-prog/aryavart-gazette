{id:1,t:"Vajendra Singh Rawat ji’s remarks on the scriptures and Kaliyuga Brahmins",a:"Shree Vajendra Singh Rawat",c:"Opinion",d:"2026-03-26",b:"Greetings. Today, I present before you Vajendra Singh Rawat, and on this day I will tell you a bitter truth that every follower of Sanatana Dharma should understand and reflect upon; it is the sole duty of every follower of Sanatana Dharma.\n\nIn today’s age, the scriptures have explained that the number of so-called saints will increase, and people will be encouraged toward hypocrisy. People listen to sweet words and ordinary thoughts from such “saints” and begin to consider themselves authorized in Bhagavat knowledge. The condition of Hindus has become such that they do not even understand which varnas should wear the yajnopavita (sacred thread), or what its significance is. Hindus consider varna to be determined by karma, which is contrary to the principles of Manu Maharaj and is also an insult to the system he established for the welfare of humanity.\n\nThose crowds who dismiss eminent acharyas as false or as later interpolations, while encouraging hypocrisy, will themselves become partners in the destruction of Sanatana Dharma. The Brahmin of today has proved to be sycophantic, greedy, and selfish for wealth, just as the deities have explained. By abandoning their varna-based duties, Brahmins are cutting down the very branch on which they sit. The knowledge given by the deities is itself a great authority for a human being to live a meaningful human life. Hindus, by encouraging varna confusion, are running after the pursuit of wealth.\n\nAs a follower of Jagadguru Nigrahacharya (Shree Bhagvatanand Guru), I myself declare that Hindus must become disciplined, and my complete political organization, while holding power, will teach the people the lessons of service and discipline.\n\nNow, let us speak about the Shastriya Sampradaya. The Shastriya Sampradaya is a tradition in which the number of followers may be small, but they are knowledgeable, free from hypocrisy, and capable of keeping themselves away from the influence of hypocrisy and Kali. As a Kshatriya politician, my only duty is to protect the nation and the people, and to make all varnas aware of their respective duties.\n\nJagadguru says: “Perform devotion, but also give importance to your children.” It is the duty of every Brahmin to give knowledge to every varna, make them aware of their varna-based duties, improve their life in this world and the hereafter, and protect their generations and lineage.\n\nHindus today try to receive Bhagavat knowledge from so-called saints—fools who have merely acquired a name—but observe their deception as well. They assume that merely hearing Bhagavat knowledge will bring about their own salvation. However, these people do not consider ordinary questions: Is that person qualified for the vyasapeetha? Has he been guided by eminent acharyas? Does he belong to a recognized sampradaya? And does he declare that he has been authorized for the vyasapeetha by eminent acharyas?\n\nPeople say that the deities cannot be so cruel as to institute the practice of sacrifice, but these people forget—or do not understand—that there are different kinds of offerings for the deities. “Sattvika” means that only vegetarian food may be offered as bhoga; “tamisra” (or the term used in the original) means that non-vegetarian food may be offered. Whenever a sacrifice is performed, it is said to produce three kinds of benefits:\n\n1. When a person offers a sacrifice, he may receive the opportunity in his next birth to slay demons.\n2. When the animal dies, it is said to attain heaven; after spending some time in heaven, it takes birth in a human womb.\n3. The shaktis accompanying the Goddess receive the offering as bhoga."},

{id:2,t:"Pressure and Brutality Inflicted by Khalistanis on Hindus in Canada",a:"Shree Vajendra Singh Rawat",c:"Geo-Political",d:"2025-11-10",b:"There has been a long-standing conspiracy—hatched by certain Punjabis—to create a new nation called Khalistan. Envisioned as a religious state, this proposed Khalistan seeks to encompass territories including Shimla, Haryana, Himachal Pradesh, Chandigarh, and even Lahore. To understand the current situation, it is essential to know the history: the Khalistani movement gained significant momentum following Operation Blue Star (initiated by Indira Gandhi on April 29, 1984), which deeply inflamed the sentiments of the Sikh community. While the dream of a separate Khalistan was held by only a few—and was neither endorsed nor desired by the Akali Dal—the movement persisted. Eventually, many Khalistani Sikhs migrated from India to Canada, where they began actively pursuing the Khalistan agenda. They have targeted Hindus there; for instance, an attack on Hindus occurred in Brampton. Meanwhile, back in India, Amritpal Singh was arrested on April 23, 2023, after 18 cartridges and 100 grams of heroin were recovered from his possession—an arrest the Punjab government had already planned.\n\nThe situation has now shifted; it is not just Hindus but the local Canadian population as well that has become frustrated with the Khalistanis. Recently, for example, an individual demanded that white people return to Europe. The Khalistanis have crossed boundaries to the extent that Khalistani leaders and MPs have even demanded the resignation of Prime Minister Justin Trudeau. If this trend continues, there is no telling when Canada might effectively transform into a Khalistan-like state. Unless swift action is taken against them, this could prove dangerous for other nations as well."},

{id:3,t:"Attacks and atrocities against Hindus in Bangladesh following the coup.",a:"Shree Vajendra Singh Rawat",c:"Geo-Political",d:"2026-08-12",b:"Chaos has engulfed Bangladesh since Sheikh Hasina stepped down as Prime Minister. Initially, Hindus united to stage protests, but the situation has since changed. While residents once guarded their homes with weapons, the Bangladeshi police and army are now attacking Hindu protesters. In one instance, police entered an office and smashed a CCTV camera with a baton—a chilling attempt to destroy evidence. With no functioning government in the country, the police and army are roaming the streets openly, creating a terrifying situation for the local Hindu population. The BJP has neither commented on the matter nor made any effort to evacuate Hindus from the region; is this the BJP’s true version of Hindutva? Meanwhile, Muslims in the area have begun raising slogans and have even issued a fatwa calling for the destruction of ISKCON. Hindus must now take action themselves; if they fail to do so, all Hindus there risk being killed."},

{id:4,t:"The oppression faced by men.",a:"Shree Vajendra Singh Rawat",c:"Societal",d:"2025-03-21",b:"Men, once considered a dominant force who ruled the era, now find themselves sidelined as urban society elevates women to positions of power—allowing them to dominate men and keep them under their thumb. Nowadays, some women weaponize the law to exploit men. Unless men rise up, this oppression will only escalate. The spread of feminism and woke culture has emboldened women, creating a sense of entitlement; to root this out, this ideology itself must be dismantled. Indian culture does not endorse or accommodate such behavior, though there are women who have worked hard to help men overcome these challenges. Recent cases—such as those involving Atul Subhash and Mr. Khurana—highlight instances where men are severely exploited by women who live lavishly on their hard-earned money. Neither the judicial system nor news channels address this issue. Society, too, has played a significant role in exacerbating this problem. If a woman is raped and killed, protests erupt at Delhi’s Red Fort, and the justice system swings into swift action; yet, when a man grapples with such issues, neither society nor the justice system offers support. If men do not become aware and take a stand, they will continue to endure this oppression. Men must protest and launch a movement against this.\n\nAs long as feminism exists, men will continue to suffer such oppression."},

{id:5,t:"The Bharatiya Janata Party is an objectionable organization.",a:"Shree Vajendra Singh",c:"Political",d:"2025-02-12",b:"The Bharatiya Janata Party is an organization that has cast a shadow of doubt over the unity and integrity of the entire nation. It is an organization currently in power thanks to Hindu voters, yet—observe their cunning—they raised issues in favor of Hindus without actually fulfilling their duties towards them; this is a matter that causes both anger and distress. While a Hindu certainly identifies as one, in the present times, they are not upholding the duties expected of a Hindu; instead, they prioritize self-interest, which renders them foolish and obstinate rather than virtuous and steadfast. Leaders of the Bharatiya Janata Party, who ought to have familiarized the people with Sanatan principles and discipline, have instead encouraged them to indulge in arbitrary behavior, thereby jeopardizing their well-being in both this world and the hereafter. How can such petty politicians ever serve as guides for Hindus? The title of ‘Leader’ (Neta) is one that truly belongs to Lord Narayana; these sycophants and hypocrites have shown no respect for that dignity either. The party has committed numerous scams in the name of development—fraud involving roads, water tanks, and various other materials. Modi, who initially postured as a champion of Hindu interests, now parades around as a secularist. He travels abroad, fraternizing and laughing all day with Mlechchhas (foreigners/outsiders). He possesses neither political acumen nor an understanding of the public; his existence is driven solely by the need to fill his own belly and pander to Adani. Shri Jagadguru Vidyamartand Nigrahacharya (Shri Bhagvatanand Guru) condemned him, stating: Sannipaton naram cheva Shivaprasad bhanjakam—meaning, a person who desecrates the Shivling or commits betrayal becomes afflicted by the disease of Sannipat (a severe, delirious fever). This verse illustrates how one who digs a pit for others—as Modi does—ultimately falls into the very pit he dug himself. The BJP is nothing but a hypocritical organization that is fooling Hindus through deception."},

{id:6,t:"Gandhi Jayanti",a:"Shree Vajendra Singh Rawat",c:"Opinion",d:"2025-01-01",b:"Today marks the day dedicated to the man who led our country along the path of non-violence and secured a measure of relief from British rule. He had both ardent admirers and staunch critics. His contributions were indeed significant; however, the actual expulsion of the British from the country was achieved through the path of armed resistance—a fact often overlooked by those who simply adopted the Gandhi cap and followed his ideology. Yet, amidst the proponents of non-violence, there were individuals who truly toiled to secure the nation’s independence—figures like Vinayak Damodar Savarkar, Bhagat Singh, and other revolutionaries who chose the path of armed struggle to propel the country forward and show the people the right direction. While these individuals deserved recognition and praise, their names and histories were often sidelined in favor of Gandhi’s; consequently, the public remained largely unaware of these revolutionaries and their true contributions. This year, Randeep Hooda released the film Swatantrya Veer Savarkar, which portrays the life of Vinayak Damodar Savarkar—highlighting his struggles and the sacrifices made by his family and friends. It depicts how he raised his voice against the British on their own soil and orchestrated the assassination of Lord Curzon’s intelligence chief through Madan Lal Dhingra—an act for which Dhingra was subsequently executed. When the British raided India House, Savarkar was in France with Madame Bhikaiji Cama; he later surrendered at a London railway station, endured twenty-six years of imprisonment, and eventually returned to serve the nation. After his release from prison, he joined the Hindu Mahasabha and urged people to enlist in the army in large numbers, telling them that while the British once used to deport people to ‘Kala Pani’ (Andaman’s Cellular Jail) merely for possessing a gun, they were now handing weapons to Indians themselves; he advised that the time would eventually reveal in which direction those gun barrels should be turned. However, when the British left and the Congress assumed power, Nehru did not prioritize military strength; consequently, India suffered defeat against China in the first war. Despite our soldiers fighting with all their might, we lost to China due to a lack of sufficient military power. Savarkar vehemently opposed Nehru over this issue, and he passed away on February 26, 1966, after undertaking a fast."},

{id:7,t:"Refutations of Cockroach Janta Party Goals",a:"Shree Vajendra Singh Rawat",c:"Political",d:"2025-06-09",b:"Greetings, brothers and sisters. I, Vajendra Singh Rawat, wish to present a startling rebuttal that will challenge your current perspective and compel you to reconsider your stance toward this organization. It is not a genuine organization, but rather an elaborate charade. It traps our budding new generation in a cycle of idleness, wasted time, and endless, futile debates—discussions that offer no solutions to problems and lead to no meaningful conclusions. In the end, they simply shrug and say, “Whatever happens, Abhijit will handle it.” So far, only the unemployed and the indolent have joined this group—fools who actively seek out such associations—all while claiming they intend to “uphold the legacy of Bhagat Singh.” If they truly consider themselves such devoted followers of Ambedkar, they ought to realize that Ambedkar himself stated in an interview that democracy is, by no means, a successful or stable system. Furthermore, when Periyar burned the Constitution—which Ambedkar helped draft—no one from this group raised a word. These people are followers in name only; they possess no real knowledge. They engage in posturing and display grand ambitions—which are all too apparent—simply to assert their own dominance. They seem to believe that Abhijit Dipke will eventually be arrested, but do they even grasp the fact that Abhijit lacks any real understanding of politics? How can we place our trust in someone who, despite having studied abroad and served as an activist for the organization, functioned merely as its PR agent?"}
